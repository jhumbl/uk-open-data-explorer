name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_retry:
        description: "Test the retry path: the first attempt is made to fail"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The serving promise is tested, not assumed — never deploy a site
      # whose data contract is broken (see CLAUDE.md, invariant 3).
      - run: npm run smoke
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Pages deployments intermittently stall server-side at
  # "syncing_files" (2026-11: four runs). Measured 2026-11-10: a stall
  # is tied to the uploaded ARTIFACT — re-sending the same artifact
  # stalled three times over 13 minutes, while a fresh run (fresh upload)
  # went through in seconds straight after. So: give up on the first
  # attempt after 3 minutes (the action cancels its own deployment on
  # timeout), re-upload the same files as a new artifact, deploy that.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.second.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - id: first
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 180000
          # force_retry points the first attempt at a missing artifact,
          # so it fails at once and the retry path runs for real.
          artifact_name: ${{ inputs.force_retry && 'no-such-artifact' || 'github-pages' }}
      - if: steps.first.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: retry
      - if: steps.first.outcome == 'failure'
        run: mkdir site && tar -xf retry/artifact.tar -C site
      - if: steps.first.outcome == 'failure'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-retry
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 180000
          artifact_name: github-pages-retry
