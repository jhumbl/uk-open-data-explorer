name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_retry:
        description: "Test the retry path: first attempt times out after 1 s"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The serving promise is tested, not assumed — never deploy a site
      # whose data contract is broken (see CLAUDE.md, invariant 3).
      - run: npm run smoke
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Pages deployments intermittently stall server-side at
  # "syncing_files" and sit out deploy-pages' 10-minute default
  # (2026-11, three times); a fresh attempt has always gone through in
  # seconds. So: give up after 3 minutes (the action cancels its own
  # deployment on timeout) and retry once from the same artifact.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: ${{ inputs.force_retry && 1000 || 180000 }}
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 180000
