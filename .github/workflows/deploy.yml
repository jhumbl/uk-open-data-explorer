name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_retry:
        description: "Test the retry path: the first attempt is made to fail"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The serving promise is tested, not assumed — never deploy a site
      # whose data contract is broken (see CLAUDE.md, invariant 3).
      - run: npm run smoke
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Pages deployments intermittently stall server-side at
  # "syncing_files" and sit out deploy-pages' 10-minute default
  # (2026-11, three times), and GitHub refuses a new deployment while an
  # earlier one is still "in progress" on its side — even one its API
  # already reports as finished (seen 2026-11-10, cleared on its own).
  # A later attempt has always gone through. So: give up on an attempt
  # after 3 minutes (the action cancels its own deployment on timeout),
  # wait, and try again — three attempts, backing off 1 then 2 minutes.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.third.outputs.page_url || steps.second.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - id: first
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 180000
          # force_retry points the first attempt at a missing artifact,
          # so it fails at once and the retries run for real.
          artifact_name: ${{ inputs.force_retry && 'no-such-artifact' || 'github-pages' }}
      - if: steps.first.outcome == 'failure'
        run: sleep 60
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 180000
      - if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
        run: sleep 120
      - id: third
        if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 180000
